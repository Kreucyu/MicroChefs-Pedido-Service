spring:
  application:
    name: pedidos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9004/pedidos}
    username: ${SPRING_DATASOURCE_USERNAME:docker}
    password: ${SPRING_DATASOURCE_PASSWORD:docker}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqps://voowobdz:oPXu8xSnc3nXS_GlD6QR2wg9nz1afCdY@jackal.rmq.cloudamqp.com/voowobdz}
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        acknowledge-mode: auto
        retry:
          enabled: false

# O bloco 'management' estava indentado dentro de 'spring:' (erro).
# Deve ficar no nível raiz para funcionar corretamente.
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:8100}

api:
  security:
    token:
      secret: CHAVE_SUPER_SECRETA_BPUI_123456789
